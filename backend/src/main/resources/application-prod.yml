spring:
  jpa:
    database-platform: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      max-lifetime: 280000
      idle-timeout: 120000
      connection-timeout: 30000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.ces.rewards: INFO
